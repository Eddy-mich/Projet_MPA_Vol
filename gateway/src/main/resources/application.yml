server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: recherche
          uri: ${RECHERCHE_URL:http://localhost:8081}
          predicates:
            - Path=/api/recherche/**
          filters:
            - StripPrefix=1
        - id: reservation
          uri: ${RESERVATION_URL:http://localhost:4000}
          predicates:
            - Path=/api/reservations/**
          filters:
            - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: INFO
